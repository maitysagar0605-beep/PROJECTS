<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOUR PALETTE GENERATOR</title>
    <link rel="stylesheet" href="style16.css">
    <script src="https://kit.fontawesome.com/81b1e443de.js" crossorigin="anonymous"></script>
</head>
<body>
     <div class="container">
        <h1>COLOUR PALETTE GENERATOR</h1>
        <button class="generate-btn">
            <i class="fas fa-sync-alt"></i>
            Generate Palette
        </button>
        <div class="palette-container">
           <!-- COLOR BOX 1-->
            <div class="color-box">
                <div class="color" style="background-color: #ff6b6b;"></div>
                <div class="color-info">
                    <span class="hex-value">#FF6B6B</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
            <!-- COLOR BOX 2-->
            <div class="color-box">
                <div class="color" style="background-color: #8f1ddb;"></div>
                <div class="color-info">
                    <span class="hex-value">#8F1DDB</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
            <!-- COLOR BOX 3-->
            <div class="color-box">
                <div class="color" style="background-color: #17df49;"></div>
                <div class="color-info">
                    <span class="hex-value">#17DF49</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
            <!-- COLOR BOX 4-->
            <div class="color-box">
                <div class="color" style="background-color: #b2d418;"></div>
                <div class="color-info">
                    <span class="hex-value">#B2D418</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
            <!-- COLOR BOX 5-->
            <div class="color-box">
                <div class="color" style="background-color: #18b0bb;"></div>
                <div class="color-info">
                    <span class="hex-value">#18B0BB</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
            <!-- COLOR BOX 6-->
            <div class="color-box">
                <div class="color" style="background-color: #0b28cc;"></div>
                <div class="color-info">
                    <span class="hex-value">#0B28CC</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
            <!-- COLOR BOX 7-->
            <div class="color-box">
                <div class="color" style="background-color: #e68910;"></div>
                <div class="color-info">
                    <span class="hex-value">#E68910</span>
                    <span class="copy-btn" title="Copy to Clipboard">
                        <i class="far fa-copy copy-icon"></i>
                    </span>
                </div>
            </div>
        </div>
     </div>

   <script src="script16.js"></script> 
</body>
</html>
