<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Data Structure Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .queue-container {
            min-height: 220px;
            border: 2px dashed #3b82f6;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem;
            gap: 12px;
            overflow-x: auto;
            background-color: #f8fafc;
            position: relative;
        }
        
        .queue-element {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 90px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0.5rem;
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .peek-front-highlight {
            border: 4px solid #f59e0b !important;
            box-shadow: 0 0 15px #f59e0b !important;
            transform: translateY(-6px);
        }

        .peek-rear-highlight {
            border: 4px solid #8b5cf6 !important;
            box-shadow: 0 0 15px #8b5cf6 !important;
            transform: translateY(-6px);
        }

        /* Custom Scrollbar for Queue Pipe */
        .queue-container::-webkit-scrollbar {
            height: 8px;
        }
        .queue-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .queue-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .queue-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans p-4 sm:p-8 text-slate-800">
    <div class="max-w-5xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-600 mb-2">Queue Data Structure Visualizer</h1>
            <p class="text-slate-500 font-medium">FIFO: First-In, First-Out Principle</p>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Controls Panel -->
            <div class="lg:w-1/3 p-5 bg-slate-100/80 rounded-xl border border-slate-200/60 shadow-inner flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-700 mb-4 border-b border-slate-200 pb-2">Operations</h2>
                    
                    <div class="mb-4">
                        <label for="enqueue-input" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Item Value</label>
                        <input type="text" id="enqueue-input" placeholder="Enter value (e.g. 42)" 
                               class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-700 outline-none transition"
                               onkeydown="if(event.key==='Enter') enqueueElement()">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2.5">
                        <button onclick="enqueueElement()" 
                                class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-semibold py-2.5 px-4 rounded-lg transition-all shadow-md hover:shadow-emerald-200">
                            Enqueue (Insert Rear)
                        </button>

                        <button onclick="dequeueElement()" 
                                class="w-full bg-rose-500 hover:bg-rose-600 active:scale-[0.98] text-white font-semibold py-2.5 px-4 rounded-lg transition-all shadow-md hover:shadow-rose-200">
                            Dequeue (Remove Front)
                        </button>

                        <button onclick="peekFrontElement()" 
                                class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-semibold py-2.5 px-4 rounded-lg transition-all shadow-md hover:shadow-amber-200">
                            Peek (View Front)
                        </button>

                        <button onclick="peekRearElement()" 
                                class="w-full bg-purple-500 hover:bg-purple-600 active:scale-[0.98] text-white font-semibold py-2.5 px-4 rounded-lg transition-all shadow-md hover:shadow-purple-200">
                            Peek (View Rear)
                        </button>
                    </div>
                </div>

                <div class="mt-6">
                    <button onclick="clearQueue()" 
                            class="w-full text-xs font-semibold text-slate-500 hover:text-slate-700 hover:underline text-center">
                        Clear Queue
                    </button>
                    <div id="status-message" class="mt-3 p-3 text-sm font-semibold text-center rounded-lg hidden transition-all duration-300"></div>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="lg:w-2/3 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-700">Queue Pipeline</h2>
                    <span id="queue-size-badge" class="text-xs font-bold px-3 py-1 bg-blue-100 text-blue-700 rounded-full">
                        Size: 0 / 8
                    </span>
                </div>

                <!-- Queue Container Structure -->
                <div class="relative flex-1">
                    <!-- Labels for Front and Rear -->
                    <div class="flex justify-between text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-2 px-2">
                        <span class="text-amber-600 flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                            FRONT (Exit)
                        </span>
                        <span class="text-purple-600 flex items-center gap-1">
                            REAR (Entry)
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                        </span>
                    </div>

                    <div id="queue-container" class="queue-container">
                        <div class="text-slate-400 m-auto text-center font-medium">Queue is empty. Insert an element!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Proper Queue Data Structure Implementation (FIFO)
        class Queue {
            constructor() {
                this.items = [];
                this.maxCapacity = 8;
            }

            enqueue(element) {
                if (this.isFull()) return "Overflow";
                this.items.push(element);
                return true;
            }

            dequeue() {
                if (this.isEmpty()) return "Underflow";
                return this.items.shift(); // FIFO: Removes the first element
            }

            peekFront() {
                if (this.isEmpty()) return "Empty";
                return this.items[0];
            }

            peekRear() {
                if (this.isEmpty()) return "Empty";
                return this.items[this.items.length - 1];
            }

            isEmpty() {
                return this.items.length === 0;
            }

            isFull() {
                return this.items.length >= this.maxCapacity;
            }

            get size() {
                return this.items.length;
            }

            clear() {
                this.items = [];
            }
        }

        const queue = new Queue();
        const queueContainer = document.getElementById('queue-container');
        const statusMessage = document.getElementById('status-message');
        const sizeBadge = document.getElementById('queue-size-badge');
        let elementCounter = 1;

        // Render function to synchronize DOM with Queue state
        function updateVisualization(highlightType = null) {
            queueContainer.innerHTML = '';
            sizeBadge.textContent = `Size: ${queue.size} / ${queue.maxCapacity}`;

            if (queue.isEmpty()) {
                queueContainer.innerHTML = '<div class="text-slate-400 m-auto text-center font-medium">Queue is empty. Insert an element!</div>';
                return;
            }

            queue.items.forEach((item, index) => {
                const elementDiv = document.createElement('div');
                elementDiv.className = 'queue-element bg-blue-500';
                elementDiv.id = `queue-item-${index}`;
                
                // Display Value and Position Tag
                elementDiv.innerHTML = `
                    <span class="text-xs text-blue-200 font-normal mb-1">Index ${index}</span>
                    <span class="text-base truncate max-w-[80px]">${item.value}</span>
                `;

                // Add pointer indicators for Front and Rear elements
                if (index === 0 && queue.size === 1) {
                    elementDiv.innerHTML += '<span class="absolute -bottom-6 text-[10px] font-bold text-slate-600 bg-slate-200 px-1.5 py-0.5 rounded">FRONT & REAR</span>';
                } else if (index === 0) {
                    elementDiv.innerHTML += '<span class="absolute -bottom-6 text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">FRONT</span>';
                } else if (index === queue.items.length - 1) {
                    elementDiv.innerHTML += '<span class="absolute -bottom-6 text-[10px] font-bold text-purple-700 bg-purple-100 px-1.5 py-0.5 rounded">REAR</span>';
                }

                // Apply Peek Highlights
                if (highlightType === 'front' && index === 0) {
                    elementDiv.classList.add('peek-front-highlight');
                } else if (highlightType === 'rear' && index === queue.items.length - 1) {
                    elementDiv.classList.add('peek-rear-highlight');
                }

                queueContainer.appendChild(elementDiv);
            });
        }

        // Action: Enqueue
        function enqueueElement() {
            const input = document.getElementById('enqueue-input');
            let value = input.value.trim();
            
            if (value === "") {
                value = `Item ${elementCounter}`;
            }

            if (queue.isFull()) {
                showStatus("Queue Overflow! Max capacity (8) reached.", "bg-rose-100 text-rose-800 border border-rose-200");
                return;
            }

            const newItem = { value: value, id: elementCounter++ };
            queue.enqueue(newItem);
            input.value = '';
            showStatus(`ENQUEUED: "${newItem.value}" to Rear`, "bg-emerald-100 text-emerald-800 border border-emerald-200");
            updateVisualization();
        }

        // Action: Dequeue
        function dequeueElement() {
            const dequeuedItem = queue.dequeue();
            
            if (dequeuedItem === "Underflow") {
                showStatus("Queue Underflow! Queue is currently empty.", "bg-rose-100 text-rose-800 border border-rose-200");
            } else {
                showStatus(`DEQUEUED: "${dequeuedItem.value}" from Front`, "bg-rose-100 text-rose-800 border border-rose-200");
                updateVisualization();
            }
        }

        // Action: Peek Front
        function peekFrontElement() {
            const peekedItem = queue.peekFront();
            
            if (peekedItem === "Empty") {
                showStatus("Queue is empty. Nothing to peek.", "bg-amber-100 text-amber-800 border border-amber-200");
            } else {
                showStatus(`FRONT ITEM: "${peekedItem.value}"`, "bg-amber-100 text-amber-800 border border-amber-200");
                updateVisualization('front');
            }
        }

        // Action: Peek Rear
        function peekRearElement() {
            const peekedItem = queue.peekRear();
            
            if (peekedItem === "Empty") {
                showStatus("Queue is empty. Nothing to peek.", "bg-purple-100 text-purple-800 border border-purple-200");
            } else {
                showStatus(`REAR ITEM: "${peekedItem.value}"`, "bg-purple-100 text-purple-800 border border-purple-200");
                updateVisualization('rear');
            }
        }

        // Action: Clear
        function clearQueue() {
         if (queue.isEmpty()) {
             showStatus("Queue is empty!! Nothing to Clear", "bg-red-100 text-red-800");
             return;
            }
    
         queue.clear();
         showStatus("Queue cleared.", "bg-slate-200 text-slate-700");
          updateVisualization();
        }

        // Status Message Helper
        let statusTimeout;
        function showStatus(message, styleClasses) {
            clearTimeout(statusTimeout);
            statusMessage.textContent = message;
            statusMessage.className = `mt-3 p-3 text-sm font-semibold text-center rounded-lg transition-all duration-300 ${styleClasses}`;
            statusMessage.classList.remove('hidden');
            
            statusTimeout = setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3500);
        }

        window.onload = () => updateVisualization();
    </script>
</body>
</html>
