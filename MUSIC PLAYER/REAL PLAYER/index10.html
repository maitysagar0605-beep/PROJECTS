<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style10.css">
    <script src="https://kit.fontawesome.com/81b1e443de.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="music-player" id="paly-card">
           <nav>
                 <button type="button" class="circle" id="back-btn">
                 <i class="fa-solid fa-angle-left"></i>
             </button>
             <div class="circle">
                  <i class="fa-brands fa-itunes-note"></i>
             </div>
            </nav>

          <img src="../origin/bee-img2.png" class="song-img">
          <h1>Master the Blaster</h1>
          <p>Anirudh Ravichander Ft. Thalapathy Vijay</p>

          <audio id="song">
            <source src="../assests/music.mp3" type="audio/mpeg">
          </audio>

          <div class="progress-container">
              <input type="range" id="progress-bar" value="0" max="100">
              <div class="time-display">
                  <span id="current-time">00:00</span>
                  <span id="total-time">00:00</span>
              </div>
          </div>

           <div class="volume-container">
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
                <button type="button" id="volume-btn">
                   <i class="fa-solid fa-volume-high" id="volume-icon"></i>
                </button>
                <span id="volume-tooltip">100%</span>
           </div>
          <div class="controls">
               <div><i class="fa-solid fa-backward"></i></div>
               <div id="ctrl-btn">
                   <i class="fa-solid fa-play" id="ctrl-icon"></i>
               </div>
               <div><i class="fa-solid fa-forward"></i></div>
          </div>
        </div>
    </div>
    <script src="script10.js"></script>
</body>
</html>
