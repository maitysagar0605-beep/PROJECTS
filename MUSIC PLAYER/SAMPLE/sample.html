<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample</title>
    <link rel="stylesheet" href="sample.css">
    <script src="https://kit.fontawesome.com/81b1e443de.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="music-player" id="paly-card">
           <nav>
             <button type="button" class="circle" id="back-btn">
                 <i class="fa-solid fa-angle-left"></i>
             </button>
             <div class="circle">
                 <i class="fa-brands fa-itunes-note"></i>
             </div>
            </nav>
          
          <img src="../origin/galaxy-img.jpg" class="song-img">
          <h1>Peace</h1>

          <audio id="song" preload="metadata">
            <source src="../assests/Peace.mp3" type="audio/flac">
          </audio>

          <div class="progress-container">
              <input type="range" id="progress-bar" value="0" max="100">
              <div class="time-display">
                  <span id="current-time">00:00</span>
                  <span id="total-time">00:00</span>
              </div>
          </div>

           <div class="volume-container">
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
                <button type="button" id="volume-btn">
                   <i class="fa-solid fa-volume-high" id="volume-icon"></i>
                </button>
                <span id="volume-tooltip">100%</span>
           </div>
          <div class="controls">
               <button id="backward-btn"><i class="fa-solid fa-backward"></i></button>
               <div onclick="togglePlayPause()" id="ctrl-btn">
                   <i class="fa-solid fa-play" id="ctrl-icon"></i>
               </div>
               <button id="forward-btn"><i class="fa-solid fa-forward"></i></button>
          </div>
        </div>
    </div>
    <script src="sample.js"></script>
</body>
</html>
