<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-In</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://kit.fontawesome.com/81b1e443de.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
     <h1>You Are Back:)</h1>
     <h2>Get Started Where You Left Off</h2>
    </div>
    <div class="container">
        <form method="post">
           <div class="input-group">
              <label for="username">Username</label>
              <input type="text" name="username" id="username" placeholder="Enter Your Username" required>
           </div>
           <div class="input-group">
              <label for="password">Password</label>
              <div class="password-wrapper">
                 <input type="password" name="password" id="password" placeholder="Enter Your Password(At least 8 characters)" required>
                 <i class="fa-solid fa-eye" id="toggle-password"></i>
              </div>
           </div>
           <div class="options">
              <label class="remember-me">
              <input type="checkbox" name="remember">
              Remember me
              </label>
              <a href="#" class="forgot-password">Forgot password?</a>
           </div>
           <button type="submit" class="btn-submit">Log In</button>
        </form>
        <p class="footer-text">Don't Have An Account?<a href="../SIGN UP/signup.html"> Sign Up</a></p>
    </div>
    <script src="login.js"></script>
</body>
</html>
